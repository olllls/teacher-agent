version: "3.9"

services:
  app:
    build: .
    container_name: teacher-eval-agent
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./exports:/app/exports
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///data/teacher_eval.db
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    restart: unless-stopped
