version: "3.9"

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: teacher-eval-nginx
    ports:
      - "0.0.0.0:8002:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    container_name: teacher-eval-app
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./exports:/app/exports
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    restart: unless-stopped
